# Remap prefix to Alt+E
unbind C-b
set-option -g prefix M-e
bind M-e send-prefix

# Default shell — pin explicitly so tmux doesn't inherit a stale $SHELL from the session
# On NixOS use: set -g default-shell /run/current-system/sw/bin/zsh
set -g default-shell "$HOME/.nix-profile/bin/zsh"

# Vi-like navigation
setw -g mode-keys vi

# Mouse support
set -g mouse on

# Alt+hjkl in copy mode — word movement and scroll
# M-h/M-l: jump word left/right (mirrors Alt+arrow behavior)
# M-j/M-k: scroll line by line (already used outside copy mode for pane switching)
bind -T copy-mode-vi M-h send-keys -X previous-word
bind -T copy-mode-vi M-l send-keys -X next-word-end
bind -T copy-mode-vi M-j send-keys -X scroll-down
bind -T copy-mode-vi M-k send-keys -X scroll-up

# Alt+Shift+hjkl in copy mode — line/page movement (Fn-equivalent)
# M-H/M-L: jump to start/end of line (mirrors Fn+Left/Right)
# M-J/M-K: half-page down/up (mirrors Fn+Down/Up)
bind -T copy-mode-vi M-H send-keys -X start-of-line
bind -T copy-mode-vi M-L send-keys -X end-of-line
bind -T copy-mode-vi M-J send-keys -X halfpage-down
bind -T copy-mode-vi M-K send-keys -X halfpage-up

# Clipboard — pipe vi copy-mode selections to system clipboard
# clip-copy detects Wayland vs X11 at runtime (wl-copy / xsel)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip-copy"

# Keep WAYLAND_DISPLAY and DISPLAY up to date in tmux environment
set -g update-environment "DISPLAY WAYLAND_DISPLAY XAUTHORITY"

# Paste from system clipboard — clip-paste detects Wayland vs X11 at runtime
bind v run "clip-paste | tmux load-buffer - && tmux paste-buffer"

# Allow paste-buffer while holding prefix (Alt+E + ])
bind -n M-] paste-buffer

# Yank last command output — walks back through scrollback to find the two most
# recent prompt lines (❯) and copies everything between them to clipboard
bind y run -b "tmux capture-pane -p -S -50 | tac | awk '/❯/{c++; if(c==2)exit; skip=1; next} skip{skip=0; next} c==1' | tac | xclip -selection clipboard -i && tmux display-message 'last output copied'"

# Alt+H — enter copy mode (no prefix needed)
bind -n M-h copy-mode

# M-j: jump to last active pane (MRU toggle); M-o: cycle panes in order
# In TUI apps (yazi/helix/(n)vim) M-j forwards to the app instead — yazi uses it
# to scroll the preview pane, and we don't want tmux stealing app-level keys.
bind -n M-j if-shell -F '#{m/r:^(yazi|hx|n?vim)$,#{pane_current_command}}' \
  'send-keys M-j' 'select-pane -l'
bind -n M-o select-pane -t :.+

# ─── Window titles ────────────────────────────────────────────────────────────
set -g set-titles on
set -g set-titles-string "#h · #S · #W · #{pane_title}"

# ─── Sessionizer ──────────────────────────────────────────────────────────────
bind -n C-f display-popup -E -w 60% -h 50% "sessionizer"

# ─── Scrollback grep ─────────────────────────────────────────────────────────
bind g display-popup -E -w 90% -h 90% "tmux capture-pane -p -S - | fzf --no-sort --tac | tmux load-buffer - && tmux display-message 'loaded to buffer'"

# ─── Keybinds reference ───────────────────────────────────────────────────────
unbind -T prefix Space
bind Space display-popup -E -w 60% -h 80% "less ~/.tmux/keybinds.md"

# ─── Plugins (TPM) ────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key M-t

# Catppuccin — set pane/mode overrides before TPM so catppuccin's -ogq defaults don't win
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number ""
set -g @catppuccin_window_current_number ""
set -g @catppuccin_window_current_text "❖ #W"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_number_color "#272822"
set -g @catppuccin_window_current_text_color "#272822"
set -g @catppuccin_pane_border_style "fg=#49483E"
set -g @catppuccin_pane_active_border_style "fg=#A6E22E,bold"

# Status bar — right side indicators
# #{?client_prefix,…}  lights up when prefix (Alt+E) is held, waiting for chord
# #{?window_zoomed_flag,…}  shows when a pane is fullscreened (easy to forget)
# #S always shown in Monokai pink so you always know which session you're in
set -g status-right "#{?client_prefix,#[fg=#000000,bold] ⌨ PREFIX,}#{?window_zoomed_flag,#[fg=#000000,bold] 🔍 ZOOM,}#[fg=#232526,bold] #(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null)%% · %H:%M · #h · #S "

# ─── GNOME focus / alt-tab indicator ─────────────────────────────────────────
# Requires focus-events so the terminal forwards focus in/out to tmux.
set -g focus-events on
# Flash the whole status bar Monokai pink when this terminal window gains focus.
# Dims to grey when focus leaves — makes it obvious which terminal you're in.
set-hook -g client-focus-in  'set status-style "bg=#F92672,fg=#000000,bold" ; set -g @_ctp_status_bg "#F92672"'
set-hook -g client-focus-out 'set status-style "bg=#A6E22E,fg=#000000" ; set -g @_ctp_status_bg "#A6E22E"'

# Auto-save every 15 min, restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM — keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'

# Direct M-t binding for thumbs — plugin only binds into prefix table, this skips the prefix.
# M-f explicitly unbound: Alt+Right sends \ef, which tmux would otherwise intercept as M-f.
unbind -n M-f
unbind -T prefix M-f
bind -n M-t run-shell -b ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.sh
unbind -T prefix M-t
# Overwrite the thumbs-pick alias at a fixed index to prevent -ag accumulation across sources.
set -g command-alias[6] "thumbs-pick=run-shell -b ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.sh"
# Catppuccin + Continuum override status-left and status-right during TPM init — reset after
set -g status-left "#[fg=#232526,bold] #{pane_index} ▶ #[default]"
set -g status-left-length 20
set -g status-right "#{?client_prefix,#[fg=#000000]#[bold] PREFIX,}#{?window_zoomed_flag,#[fg=#000000]#[bold] ZOOM,}#[fg=#000000]#[bold] #(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null)%% · %H:%M · #S"
set -g status-right-length 150
set -g mode-style "bg=#E6DB74,fg=#272822,bold"
set -g copy-mode-current-match-style "bg=#FD971F,fg=#272822,bold"
set -g cursor-colour "#FD971F"
