# Remap prefix — Alt+E on the laptop, Alt+W on remote hosts.
# This is the single mechanism that lets us SSH from a local tmux pane INTO a
# remote tmux without prefix collision. Both prefixes are addressable from the
# same keyboard simultaneously, so nesting "just works" key-wise. Status bars
# do stack vertically when focused inside the SSH window — that's the only
# cosmetic cost. Hostname check uses a substring of the Dell laptop's hostname
# so future renames within that machine still match.
unbind C-b
if-shell 'hostname -s | grep -q Dell-Pro-Max-14' \
  'set-option -g prefix M-e ; bind M-e send-prefix' \
  'set-option -g prefix M-w ; bind M-w send-prefix'

# Default shell — pin explicitly so tmux doesn't inherit a stale $SHELL from the session
# On NixOS use: set -g default-shell /run/current-system/sw/bin/zsh
set -g default-shell "$HOME/.nix-profile/bin/zsh"

# Vi-like navigation
setw -g mode-keys vi

# Mouse support
set -g mouse on

# Alt+hjkl in copy mode — word movement and scroll
# M-h/M-l: jump word left/right (mirrors Alt+arrow behavior)
# M-j/M-k: scroll line by line (already used outside copy mode for pane switching)
bind -T copy-mode-vi M-h send-keys -X previous-word
bind -T copy-mode-vi M-l send-keys -X next-word-end
bind -T copy-mode-vi M-j send-keys -X scroll-down
bind -T copy-mode-vi M-i send-keys -X scroll-down
bind -T copy-mode-vi M-k send-keys -X scroll-up

# Alt+Shift+hjkl in copy mode — line/page movement (Fn-equivalent)
# M-H/M-L: jump to start/end of line (mirrors Fn+Left/Right)
# M-J/M-K: half-page down/up (mirrors Fn+Down/Up)
bind -T copy-mode-vi M-H send-keys -X start-of-line
bind -T copy-mode-vi M-L send-keys -X end-of-line
bind -T copy-mode-vi M-J send-keys -X halfpage-down
bind -T copy-mode-vi M-K send-keys -X halfpage-up

# Clipboard — OSC 52 escapes carry yanks straight to the host terminal
# (ghostty has clipboard-write=allow), which forwards into the GNOME clipboard.
# Works over SSH automatically; no xsel/wl-copy wrapper layer.
set -g set-clipboard on
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Paste from system clipboard — xclip pulls X11 CLIPBOARD into a tmux buffer
bind v run "xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer"

# Allow paste-buffer while holding prefix (Alt+E + ])
bind -n M-] paste-buffer

# Alt+C — enter copy mode (no prefix needed)
bind -n M-c copy-mode

# prefix+l = last-window, but REPEATABLE. After hitting Alt+E once, you can
# keep tapping `l` within repeat-time to flip back and forth between
# current/last without re-pressing the prefix. Single `Alt+E l` unchanged.
# Bump repeat-time from default 500ms → 800ms so casual tapping stays inside
# the window. Unbind first to ensure no shadow definition remains.
set -g repeat-time 800
unbind -T prefix l
bind -r l last-window

# Yank last command output — walks back through scrollback to find the two most
# recent prompt lines (❯) and copies everything between them to clipboard
bind y run -b "tmux capture-pane -p -S -50 | tac | awk '/❯/{c++; if(c==2)exit; skip=1; next} skip{skip=0; next} c==1' | tac | xclip -selection clipboard -i && tmux display-message 'last output copied'"

# M-j / M-i: jump to last active pane (MRU toggle); M-o: cycle panes in order.
# In TUI apps (yazi/helix/(n)vim) the alt-letter forwards to the app instead —
# yazi uses M-j to scroll the preview pane, and we don't want tmux stealing
# app-level keys. M-i is a parallel binding with identical behavior (same
# key forwarded to the app so editor bindings see M-i not M-j).
bind -n M-j if-shell -F '#{m/r:^(yazi|hx|n?vim)$,#{pane_current_command}}' \
  'send-keys M-j' 'select-pane -l'
bind -n M-i if-shell -F '#{m/r:^(yazi|hx|n?vim)$,#{pane_current_command}}' \
  'send-keys M-i' 'select-pane -l'
bind -n M-o select-pane -t :.+

# ─── Window titles ────────────────────────────────────────────────────────────
set -g set-titles on
set -g set-titles-string "#h · #S · #W · #{pane_title}"

# ─── Sessionizer ──────────────────────────────────────────────────────────────
bind -n C-f display-popup -E -w 60% -h 50% "sessionizer"

# ─── Machine-local overrides ──────────────────────────────────────────────────
# Personal SSH-into-remote bindings (prefix+G, prefix+H, etc. → tx-remote <host>)
# live in ~/.tmux.conf.local. That file is NOT tracked in this repo so private
# hostnames stay off GitHub. install.sh seeds the file from
# tmux/tmux.conf.local.example if it's missing — edit it to your liking.
#
# The framework (sync-to-host + tx-remote scripts, hostname-conditional prefix
# above) is generic — only the specific bind-to-hostname mappings are personal.
if-shell '[ -f ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'

# ─── Scrollback grep ─────────────────────────────────────────────────────────
bind g display-popup -E -w 90% -h 90% "tmux capture-pane -p -S - | fzf --no-sort --tac | tmux load-buffer - && tmux display-message 'loaded to buffer'"

# ─── Plugins (TPM) ────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key M-t

# Catppuccin — flavor kept for anything the plugin auto-detects against.
# Native tmux window-status-format below (post-TPM) renders the window list,
# replacing catppuccin's heavier templates + diamond glyph. Pane border
# colors are also set natively (post-TPM) so nothing the plugin does can
# override them.
set -g @catppuccin_flavor 'mocha'

# Status bar — right side indicators
# #{?client_prefix,…}  lights up when prefix (Alt+E) is held, waiting for chord
# #{?window_zoomed_flag,…}  shows when a pane is fullscreened (easy to forget)
# #S always shown in Monokai pink so you always know which session you're in
set -g status-right "#{?client_prefix,#[fg=#000000,bold] ⌨ PREFIX,}#{?window_zoomed_flag,#[fg=#000000,bold] 🔍 ZOOM,}#[fg=#232526,bold] #(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null)%% · %H:%M · #h · #S "

# ─── GNOME focus indicator ───────────────────────────────────────────────────
# focus-events lets tmux know when its terminal window has focus.
set -g focus-events on
# Each hook flips THREE styles together so the window list (tabs) reads
# correctly against the bar's new bg.
#  • Focused client → red bg, black bold everywhere; active tab pops in orange-on-black
#  • Unfocused client → transparent bg, red text; active tab stays black-on-red so the
#    active tab is visually distinct in both states.
set-hook -g client-focus-in  'set status-style "bg=#F92672,fg=#000000,bold" ; set window-status-style "fg=#000000,bg=#F92672,bold" ; set window-status-current-style "fg=#FD971F,bg=#000000,bold"'
set-hook -g client-focus-out 'set status-style "bg=default,fg=#F92672" ; set window-status-style "fg=#F92672" ; set window-status-current-style "fg=#000000,bg=#F92672,bold"'

setw -g monitor-bell on

# tmux-resurrect kept available for MANUAL session save/restore via
#   prefix Ctrl-s  → save now
#   prefix Ctrl-r  → restore from last save
# Continuum (the auto-save + auto-restore wrapper) is intentionally DISABLED:
#   - Auto-restore on tmux start printed "couldn't find resurrect file"
#     errors on fresh boots when no save existed yet.
#   - Auto-save churned through ad-hoc / pronounceable sessions we don't
#     care about restoring, wasting disk + restoring noise post-reboot.
# Workflow instead: opt in by hitting Ctrl-s on a session you actually want
# preserved across reboots. Project sessions recreate cleanly via
# `tx <name>` anyway — cwd comes from sessions.toml.
set -g @continuum-restore 'off'
set -g @continuum-save-interval '0'

# Initialize TPM — keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'

# M-f explicitly unbound: Alt+Right sends \ef, which tmux would otherwise intercept as M-f.
unbind -n M-f
unbind -T prefix M-f
# tmux-thumbs: keep PREFIX-table binding (prefix → M-t) so it stays available
# on demand. Removed the no-prefix `bind -n M-t` shortcut — Alt+T collides
# with Helix/nvim/vim's terminal/jumplist bindings inside editor splits.
# Use `prefix M-t` to invoke thumbs when you need it.
unbind -n M-t
# Overwrite the thumbs-pick alias at a fixed index to prevent -ag accumulation across sources.
set -g command-alias[6] "thumbs-pick=run-shell -b ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.sh"
# ─── Status bar — plain text; colors driven by status-style + window-status ─
# Reset after TPM init (catppuccin + continuum overwrite earlier).
# Plain segment strings: no inline #[fg=...] (that breaks #{?...} conditionals
# on the comma inside the style spec). Three styles drive the full bar:
#   status-style — base bar colors (segments)
#   window-status-style — inactive windows in the list
#   window-status-current-style — the active window in the list
# Focus hooks above flip all three in sync.
set -g status-left-length 30
set -g status-right-length 150
set -g status-left  " #S │ "
set -g status-right "#{?client_prefix, PREFIX │ ,}#{?window_zoomed_flag, ZOOM │ ,}#T │ #h │ #(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null)%% │ %H:%M "

# Initial state matches the "unfocused" branch of the focus hook above —
# tmux fires client-focus-in once the window gets focus so this only shows
# briefly during reload / between client connects.
set -g status-style "bg=default,fg=#F92672"
set -g window-status-style "fg=#F92672"
set -g window-status-current-style "fg=#000000,bg=#F92672,bold"
set -g window-status-bell-style "fg=#000000,bg=#E6DB74,bold"
# #F = tmux's built-in flag indicator: * (current), - (last), ! (bell),
# ~ (silent), Z (zoomed), M (marked). Renders only when applicable.
set -g window-status-format " #I:#W#F "
set -g window-status-current-format " #I:#W#F "
set -g window-status-separator ""

set -g mode-style "bg=#F92672,fg=#000000,bold"
set -g copy-mode-current-match-style "bg=#FD971F,fg=#272822,bold"
set -g cursor-colour "#FD971F"

# Pane borders — set post-TPM so plugin theming can't overwrite.
# Colour + line-weight are independent cues: active = Monokai pink + heavy
# glyphs; inactive = grey + thin. Hard to miss which pane is focused.
set -g pane-border-style        "fg=#49483E"
set -g pane-active-border-style "fg=#F92672,bold"
set -g pane-border-lines        single
