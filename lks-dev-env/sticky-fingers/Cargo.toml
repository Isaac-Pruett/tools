[package]
name = "sticky-fingers"
version = "0.1.0"
edition = "2021"
description = "Hyper-lightweight evdev keystroke logger with per-line timestamps"
license = "MIT"

[dependencies]
evdev = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
