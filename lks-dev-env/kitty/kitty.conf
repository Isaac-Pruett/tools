# ─── Font ─────────────────────────────────────────────────────────────────────
font_family      GeistMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# ─── Shell ────────────────────────────────────────────────────────────────────
# Pin explicitly so kitty always launches zsh regardless of session $SHELL
# On NixOS use: /run/current-system/sw/bin/zsh --login
shell ~/.nix-profile/bin/zsh --login

# ─── Performance ──────────────────────────────────────────────────────────────
sync_to_monitor  yes
repaint_delay    10
input_delay      3

# ─── Window ───────────────────────────────────────────────────────────────────
hide_window_decorations  yes
window_padding_width     8
remember_window_size     yes

# ─── Cursor ───────────────────────────────────────────────────────────────────
cursor_shape          block
cursor_blink_interval 0
cursor                #FD971F

# ─── Bell ─────────────────────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.0

# ─── Key bindings ─────────────────────────────────────────────────────────────
# Explicit reload so GNOME doesn't intercept Ctrl+Shift+F5
map ctrl+shift+f5 load_config_file

# ─── Scrollback ───────────────────────────────────────────────────────────────
scrollback_lines 10000

# ─── URLs ─────────────────────────────────────────────────────────────────────
url_style    curly
open_url_with default

# ─── Tab bar ──────────────────────────────────────────────────────────────────
tab_title_template      " {title}"
tab_bar_style           powerline
tab_powerline_style     round
tab_bar_min_tabs        1
active_tab_foreground   #000000
active_tab_background   #A6E22E
inactive_tab_foreground #75715E
inactive_tab_background #000000
tab_bar_background      #000000

# ─── AMOLED Black + Monokai ───────────────────────────────────────────────────
foreground           #F8F8F2
background           #000000
selection_foreground #F8F8F2
selection_background #49483E
cursor_text_color    #000000
url_color            #66D9EF

# Black
color0  #272822
color8  #75715E
# Red
color1  #F92672
color9  #F92672
# Green
color2  #A6E22E
color10 #A6E22E
# Yellow
color3  #E6DB74
color11 #E6DB74
# Blue / Cyan (Monokai uses cyan as its "blue")
color4  #66D9EF
color12 #66D9EF
# Magenta / Purple
color5  #AE81FF
color13 #AE81FF
# Cyan
color6  #A1EFE4
color14 #A1EFE4
# White
color7  #F8F8F2
color15 #F9F8F5
